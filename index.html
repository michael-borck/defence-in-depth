<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defence in Depth has moved — Security Toys</title>
<link rel="canonical" href="https://michael-borck.github.io/security-toys/defence-in-depth/">
<meta http-equiv="refresh" content="0; url=https://michael-borck.github.io/security-toys/defence-in-depth/">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#22304d;--ink:#e6edf7;--muted:#93a4c3;--accent:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 30% -10%, #16223c 0%, var(--bg) 55%);
    color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{background:var(--panel); border:1px solid var(--line); border-radius:16px;
       padding:32px 34px; max-width:56ch; text-align:center;}
  h1{font-size:22px; letter-spacing:.3px;}
  h1 span{color:var(--accent);}
  p{color:var(--muted); font-size:15px; line-height:1.65; margin-top:14px;}
  a.go{
    display:inline-block; margin-top:22px; padding:12px 22px; border-radius:10px;
    background:linear-gradient(180deg,#1d4ed8,#1e40af); color:#fff; font-weight:700;
    text-decoration:none; font-size:15px;
  }
  a.alt{color:var(--muted); font-size:13.5px;}
</style>
</head>
<body>
  <div class="box">
    <h1>Defence in Depth has <span>moved</span></h1>
    <p>
      The Swiss-Cheese game now lives in <b>Security Toys</b>, alongside the other single-page
      teaching toys. Same game, new address — you should be redirected automatically.
    </p>
    <a class="go" href="https://michael-borck.github.io/security-toys/defence-in-depth/">Play it at its new home</a>
    <p><a class="alt" href="https://michael-borck.github.io/security-toys/">Browse all the toys →</a></p>
  </div>
<script>
  // Preserve any query string or hash across the move.
  location.replace("https://michael-borck.github.io/security-toys/defence-in-depth/"
                   + location.search + location.hash);
</script>
</body>
</html>
